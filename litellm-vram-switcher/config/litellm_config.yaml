# LiteLLM Gateway Configuration (Port 4000)
# Routes to local llama-swap on port 8000 with automatic cloud fallback
# Upstream canonical: /run/media/rodri/AI/skills/litellm-vram-switcher/config/litellm_config.yaml

model_list:
  # ============================================================
  # LOCAL WORKSTATION MODELS (via llama-swap on :8000)
  # ============================================================
  - model_name: agent-coder
    litellm_params:
      model: openai/qwen3.6-35b
      api_base: http://127.0.0.1:8000/v1
      api_key: "local-no-key"
      timeout: 60

  - model_name: agent-fast
    litellm_params:
      model: openai/gemma4-26b
      api_base: http://127.0.0.1:8000/v1
      api_key: "local-no-key"
      timeout: 45

  - model_name: agent-classifier
    litellm_params:
      model: openai/imajev-4b
      api_base: http://127.0.0.1:8000/v1
      api_key: "local-no-key"
      timeout: 20

  - model_name: agent-ocr
    litellm_params:
      model: openai/lighton-ocr
      api_base: http://127.0.0.1:8000/v1
      api_key: "local-no-key"
      timeout: 30

  - model_name: agent-browser
    litellm_params:
      model: openai/deskforge-4b
      api_base: http://127.0.0.1:8000/v1
      api_key: "local-no-key"
      timeout: 30

  # ============================================================
  # CLOUD FALLBACK MODELS (OpenRouter Free + Gemini 2.5 Flash)
  # ============================================================
  - model_name: cloud-nemotron-free
    litellm_params:
      model: openrouter/nvidia/llama-3.1-nemotron-70b-instruct:free
      api_key: os.environ/OPENROUTER_API_KEY

  - model_name: cloud-openrouter-auto-free
    litellm_params:
      model: openrouter/openrouter/free
      api_key: os.environ/OPENROUTER_API_KEY

  - model_name: cloud-gemini-flash
    litellm_params:
      model: gemini/gemini-2.5-flash
      api_key: os.environ/GEMINI_API_KEY

router_settings:
  routing_strategy: simple-shuffle
  num_retries: 1
  timeout: 60
  allowed_fails: 1
  cooldown_time: 15
  fallbacks:
    - {"agent-coder": ["cloud-nemotron-free", "cloud-openrouter-auto-free", "cloud-gemini-flash"]}
    - {"agent-fast": ["cloud-openrouter-auto-free", "cloud-gemini-flash"]}
    - {"agent-classifier": ["cloud-gemini-flash"]}
    - {"agent-ocr": ["cloud-gemini-flash"]}
    - {"agent-browser": ["cloud-gemini-flash"]}
