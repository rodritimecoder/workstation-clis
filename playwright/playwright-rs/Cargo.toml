[package]
name = "playwright-agent-cli"
version = "0.2.0"
edition = "2024"

[[bin]]
name = "playwright-rs"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ureq = { version = "2.10", default-features = false, features = ["json"] }
playwright_upstream = {
    package = "playwright-rs",
    version = "=0.20.1",
    default-features = false,
    features = ["rustls-tls-webpki-roots", "ring"],
}
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
