[package]
name = "playwright-rs"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "playwright-rs"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tungstenite = { version = "0.26", default-features = false, features = ["handshake"] }
ureq = { version = "2.10", default-features = false, features = ["json"] }
base64 = "0.22"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
