name: Cloud Subagent Worker

on:
  workflow_dispatch:
    inputs:
      task:
        description: 'Task prompt for the subagent'
        required: true
        type: string
      target_branch:
        description: 'Branch name to push changes to'
        required: true
        default: 'agent/patch'
        type: string
      model:
        description: 'OpenRouter or Gemini model ID'
        required: false
        default: 'openrouter/free'
        type: string

concurrency:
  group: subagent-${{ github.workflow }}-${{ github.event.inputs.target_branch }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  subagent:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node & Python
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Fast-CDP Binary
        run: |
          mkdir -p artifacts
          if [[ -f "hybrid-browser/bin/fast-cdp" ]]; then
            chmod +x hybrid-browser/bin/fast-cdp
            sudo cp hybrid-browser/bin/fast-cdp /usr/local/bin/fast-cdp
            echo "fast-cdp installed to /usr/local/bin"
          fi

      - name: Launch Headless Chrome on CDP Port 9222
        run: |
          CHROME_BIN=$(which google-chrome || which chromium-browser || which chromium || true)
          if [[ -z "$CHROME_BIN" ]]; then
            echo "Installing lightweight chromium..."
            sudo apt-get update -qq && sudo apt-get install -y -qq chromium-browser
            CHROME_BIN=$(which chromium-browser || which chromium)
          fi
          echo "Using browser: $CHROME_BIN"
          "$CHROME_BIN" \
            --headless=new \
            --no-sandbox \
            --disable-gpu \
            --disable-software-rasterizer \
            --disable-extensions \
            --remote-debugging-port=9222 \
            about:blank > artifacts/chrome.log 2>&1 &
          sleep 1
          curl -fsSL http://127.0.0.1:9222/json/version

      - name: Prepare Subagent Branch
        run: |
          git config user.name "cloud-subagent[bot]"
          git config user.email "cloud-subagent[bot]@users.noreply.github.com"
          git checkout -b "${{ inputs.target_branch }}"

      - name: Execute Subagent via OpenRouter Skill
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CDP_ENDPOINT: "http://127.0.0.1:9222"
        run: |
          # Check which path or_agent.py exists at
          if [[ -f "openrouter-free/scripts/or_agent.py" ]]; then
            AGENT_SCRIPT="openrouter-free/scripts/or_agent.py"
          elif [[ -f ".agents/skills/openrouter-free/scripts/or_agent.py" ]]; then
            AGENT_SCRIPT=".agents/skills/openrouter-free/scripts/or_agent.py"
          else
            echo "Error: or_agent.py not found" >&2
            exit 1
          fi

          python3 "$AGENT_SCRIPT" \
            --prompt "${{ inputs.task }}" \
            --model "${{ inputs.model }}"

      - name: Upload Verification Artifacts (Screenshots & Logs)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: subagent-artifacts-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: ignore

      - name: Commit, Push, and Open PR if Changes Exist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            git add -A
            git commit -m "chore(subagent): ${{ inputs.task }}"
            git push -u origin "${{ inputs.target_branch }}" --force
            gh pr create \
              --title "[Subagent] ${{ inputs.task }}" \
              --body "Automated patch generated by Cloud Subagent using model \`${{ inputs.model }}\`." \
              --head "${{ inputs.target_branch }}" \
              --base main || true
          else
            echo "No file changes made by subagent."
          fi
